# Netlify config for the LIVE super-admin, wired to the deployed backend.
#
# This branch exists only because netlify.toml takes precedence over a site's
# UI settings: `main` carries the standalone mock demo, and a second Netlify
# site pointed at `main` would silently inherit that demo build no matter what
# was configured in the dashboard. Keeping the two builds on two branches is
# what keeps them independent.
#
# main        -> mock demo, no backend  (bplay-superadmin-yazbek2003)
# deploy/live -> this file, real API    (the live site)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Real data, not the in-memory mocks.
  VITE_USE_MOCKS = "false"
  # The deployed API, including the /api/v1 prefix the client expects.
  # Must match the backend's own APP_URL host, or uploaded media 404s.
  VITE_API_BASE_URL = "https://bplay-backend1-production.up.railway.app/api/v1"
  NODE_VERSION = "22"

# SPA fallback: every path serves index.html so refresh & deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
